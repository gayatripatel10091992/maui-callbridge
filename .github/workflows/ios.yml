name: iOS

# Builds the iOS app for the simulator on macOS. Separate from CI because macOS runners are slower and the
# Xcode version must match the .NET iOS workload; start it from the Actions tab.
on:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios
      - name: Build for iOS simulator
        run: >
          dotnet build src/CallBridge.Maui/CallBridge.Maui.csproj -f net10.0-ios -c Debug
          -p:RuntimeIdentifier=iossimulator-arm64
