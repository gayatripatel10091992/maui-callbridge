name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  APP_ID: com.gayatripatel.callbridge.maui

jobs:
  core-tests:
    name: Core + view model tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/CallBridge.Core.Tests/CallBridge.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  android:
    name: Android build + emulator screenshots
    needs: core-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: 17

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK dependencies
        run: >
          dotnet build src/CallBridge.Maui/CallBridge.Maui.csproj -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True

      - name: Publish release APK
        run: >
          dotnet publish src/CallBridge.Maui/CallBridge.Maui.csproj -f net10.0-android -c Release
          -p:AndroidSdkDirectory="$ANDROID_HOME" -o artifacts/android

      - name: Locate signed APK
        run: |
          ls -la artifacts/android
          cp "$(ls artifacts/android/*-Signed.apk | head -n 1)" artifacts/CallBridge.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Plain AOSP image: lighter than google_apis, so the launcher doesn't stall on a cold boot.
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/capture-screenshots.sh ${{ env.APP_ID }} artifacts/CallBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: callbridge-maui-android
          path: |
            artifacts/CallBridge.apk
            docs/screenshots/android/*.png

      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        shell: bash
        run: bash .github/scripts/commit-screenshots.sh docs/screenshots/android "Android"

  windows:
    name: Windows (WinUI) build + screenshots
    needs: core-tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Publish unpackaged Windows app
        run: >
          dotnet publish src/CallBridge.Maui/CallBridge.Maui.csproj -f net10.0-windows10.0.19041.0 -c Release
          -p:RuntimeIdentifierOverride=win-x64 -o artifacts/windows
      - name: Run and capture screenshots
        shell: pwsh
        run: ./.github/scripts/capture-windows.ps1 -Exe "$PWD/artifacts/windows/CallBridge.Maui.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: callbridge-maui-windows
          path: docs/screenshots/windows/*.png
      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        shell: bash
        run: bash .github/scripts/commit-screenshots.sh docs/screenshots/windows "Windows"

  ios:
    name: iOS simulator build + screenshots
    needs: core-tests
    # Intel runner: hosted macOS arm64 capacity has been too short to pick these jobs up.
    runs-on: macos-26-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install MAUI workload matching the runner's Xcode
        # Each .NET iOS release needs one exact Xcode; the newest can be ahead of the hosted image.
        run: |
          read -r WORKLOAD_SET XCODE < <(python3 .github/scripts/pick-ios-workload.py)
          [ -n "$WORKLOAD_SET" ] && [ -n "$XCODE" ] || exit 1
          echo "Workload set $WORKLOAD_SET with $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # The full maui workload: restore evaluates every target framework, even when building one.
          dotnet workload install maui --version "$WORKLOAD_SET"
      - name: Build for iOS simulator
        run: |
          build() {
            dotnet build src/CallBridge.Maui/CallBridge.Maui.csproj -f net10.0-ios -c Debug \
              -p:RuntimeIdentifier=iossimulator-x64 2>&1 | tee build.log
            return "${PIPESTATUS[0]}"
          }
          if ! build; then
            # The iOS SDK names the exact Xcode it needs; switch to it if the runner has it and build again.
            WANT=$(grep -oE "requires Xcode [0-9.]+" build.log | head -n 1 | awk '{print $3}' | sed 's/\.$//')
            XCODE=$(ls -d /Applications/Xcode_"$WANT"*.app 2>/dev/null | head -n 1)
            [ -n "$WANT" ] && [ -n "$XCODE" ] || exit 1
            echo "Switching to $XCODE"
            sudo xcode-select -s "$XCODE"
            build
          fi
      - name: Run on simulator and capture screenshots
        run: |
          APP=$(find src/CallBridge.Maui/bin/Debug -name "*.app" -type d -path "*iossimulator-x64*" -prune | head -n 1)
          echo "App bundle: $APP"
          bash .github/scripts/capture-ios.sh ${{ env.APP_ID }} "$APP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: callbridge-maui-ios
          path: |
            docs/screenshots/ios/*.png
            debug/*.png
      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/commit-screenshots.sh docs/screenshots/ios "iOS"
